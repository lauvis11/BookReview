<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 72" fill="none" role="img" aria-labelledby="logo-title">
  <title id="logo-title">BookReview</title>

  <!-- Ícono: Libro abierto geométrico (Verde bosque #0e5146) -->
  <!-- Página izquierda exterior -->
  <polygon fill="#0e5146" points="10,20 34,25 34,57 10,52" />
  <!-- Página derecha exterior -->
  <polygon fill="#0e5146" points="64,20 40,25 40,57 64,52" />
  <!-- Página izquierda interior (escalonada) -->
  <polygon fill="#0e5146" points="15,15 35,21 35,23 15,17" />
  <!-- Página derecha interior (escalonada) -->
  <polygon fill="#0e5146" points="59,15 39,21 39,23 59,17" />
  <!-- Base/lomo geométrico inferior -->
  <polygon fill="#0e5146" points="34,59 37,62 40,59 37,56" />

  <!-- Ícono: Estrella saliendo de las páginas (Ámbar #e9a45e) -->
  <polygon fill="#e9a45e" points="37,6 39.9,11.9 46.5,12.9 41.7,17.5 42.9,24.1 37,21 31.1,24.1 32.3,17.5 27.5,12.9 34.1,11.9" />

  <!-- Texto: BookReview (Verde bosque #0e5146) -->
  <text x="82" y="51" fill="#0e5146" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="-0.5">BookReview</text>
</svg>
