<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- Canonical -->
    <link rel="canonical" href="https://book-review-six-rho.vercel.app/" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/bookreview-icon.svg" />
    <link rel="apple-touch-icon" href="/bookreview-icon.webp" />

    <!-- Open Graph (Social Sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BookReview" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="BookReview" />
    <meta property="og:description" content="BookReview: descubrí, calificá y discutí libros con una comunidad de lectores. Reseñas, catálogo, favoritos y un asistente de IA para tu próxima lectura." />
    <meta property="og:image" content="https://book-review-six-rho.vercel.app/Book-review.webp" />

    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://book-review-six-rho.vercel.app/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BookReview" />
    <meta name="twitter:description" content="BookReview: descubrí, calificá y discutí libros con una comunidad de lectores." />
    <meta name="twitter:image" content="https://book-review-six-rho.vercel.app/Book-review.webp" />

    <!-- JSON-LD: Website Schema (base) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "BookReview",
      "url": "https://book-review-six-rho.vercel.app/",
      "description": "Plataforma de reseñas de libros con asistente de IA integrado.",
      "inLanguage": "es",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://book-review-six-rho.vercel.app/catalog?title={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://books.google.com" />

    <!-- Prevent flash of incorrect theme before first paint -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('bookreview-theme');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || (stored !== 'light' && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;0,6..96,700;1,6..96,400;1,6..96,500;1,6..96,600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Noto+Serif:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-surface text-on-surface">
    <div id="root"></div>

  </body>
</html>
